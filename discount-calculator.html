<style>
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}
}
html,body{max-width:100%;overflow-x:hidden;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
img,svg,video,canvas{max-width:100%;display:block;}
button,input,select,textarea{font:inherit;color:inherit;}
a{color:inherit;}
ul,ol{padding-left:1.15em;}

:root{
  --bg:#ffffff;--surface:#F5F7F6;--surface-2:#EEF2F0;--ink:#101615;--ink-soft:#5B6864;--ink-faint:#647169;
  --teal:#146356;--teal-dark:#0C4137;--teal-tint:#E7F1EE;--laser:#E8402C;--laser-tint:#FDEBE7;
  --line:#E1E6E3;--line-soft:#EEF1EF;--danger:#B4291A;--danger-tint:#FCEAE7;--on-teal:#ffffff;
  --radius-lg:18px;--radius-md:12px;--radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(16,22,21,0.06);--shadow-md:0 8px 24px rgba(16,22,21,0.08);--shadow-lg:0 20px 48px rgba(16,22,21,0.14);
  --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;--font-body:'Inter',ui-sans-serif,system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --header-h:60px;--jumpnav-h:56px;--sticky-bar-h:76px;
}
[data-theme="dark"]{
  --bg:#0E1413;--surface:#161D1B;--surface-2:#1D2523;--ink:#EEF3F1;--ink-soft:#A9B5B1;--ink-faint:#77837F;
  --teal:#3FB89E;--teal-dark:#2A8C77;--teal-tint:#152622;--laser:#FF6A50;--laser-tint:#2A1714;
  --line:#28312E;--line-soft:#202826;--danger:#FF7A63;--danger-tint:#2C1815;--on-teal:#08211c;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);--shadow-md:0 8px 24px rgba(0,0,0,0.35);--shadow-lg:0 20px 48px rgba(0,0,0,0.45);
}

.wrap{max-width:1120px;margin-inline:auto;padding-inline:clamp(14px,4vw,32px);}
.tt-skip-link{position:absolute;left:-9999px;top:0;background:var(--teal);color:var(--on-teal);padding:10px 16px;border-radius:0 0 8px 0;z-index:1000;font-weight:600;}
.tt-skip-link:focus{left:0;}
:focus-visible{outline:2.5px solid var(--laser);outline-offset:2px;border-radius:4px;}

header.site{position:sticky;top:0;z-index:70;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);}
nav.main{display:flex;align-items:center;gap:20px;height:var(--header-h);}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);flex-shrink:0;}
.logo img{width:26px;height:26px;flex-shrink:0;border-radius:6px;}
.logo .word-tools{color:var(--teal);}
.nav-links{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;}
.nav-links::-webkit-scrollbar{display:none;}
.nav-links a{white-space:nowrap;font-size:14px;font-weight:500;text-decoration:none;color:var(--ink-soft);padding:8px 10px;border-radius:8px;transition:background .15s,color .15s;}
.nav-links a:hover{background:var(--surface);color:var(--ink);}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.theme-toggle{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .1s;}
.theme-toggle:hover{background:var(--surface-2);}
.theme-toggle:active{transform:scale(.92);}
.theme-toggle svg{width:18px;height:18px;color:var(--ink-soft);}
.nav-cta{display:none;}
@media(min-width:720px){.nav-cta{display:inline-flex;background:var(--teal);color:var(--on-teal);text-decoration:none;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:background .15s;}
.nav-cta:hover{background:var(--teal-dark);}}

.breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-block:12px;font-size:12.5px;color:var(--ink-faint);}
.breadcrumb a{text-decoration:none;color:var(--ink-faint);}
.breadcrumb a:hover{color:var(--teal);}
.breadcrumb .sep{opacity:.5;}
.breadcrumb span:last-child{color:var(--ink-soft);font-weight:500;}

.tt-hero{padding-block:28px 20px;}
.tt-hero-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.tt-icon{width:44px;height:44px;border-radius:12px;background:var(--teal-tint);display:flex;align-items:center;justify-content:center;font-size:22px;}
.tt-cat-badge{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.02em;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:20px;color:var(--ink-soft);}
.tt-hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5.2vw,42px);letter-spacing:-0.02em;margin:0 0 12px;line-height:1.08;}
.tt-desc{font-size:clamp(15px,2vw,17px);color:var(--ink-soft);max-width:66ch;margin:0 0 18px;}
.tt-meta-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-faint);margin-bottom:16px;}
.tt-meta-row strong{color:var(--ink-soft);font-weight:600;}
.tt-trust-row{display:flex;flex-wrap:wrap;gap:8px;}
.tt-trust-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:var(--teal-tint);color:var(--teal-dark);padding:8px 13px;border-radius:20px;}
[data-theme="dark"] .tt-trust-chip{color:var(--teal);}
.tt-trust-chip svg{width:14px;height:14px;flex-shrink:0;}

.tt-jumpnav{position:sticky;top:var(--header-h);z-index:55;background:var(--bg);border-bottom:1px solid var(--line);}
.tt-jumpnav-row{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tt-jumpnav-row::-webkit-scrollbar{display:none;}
.tt-jumpnav-row a{flex-shrink:0;min-height:36px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:0 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;}
.tt-jumpnav-row a:hover{border-color:var(--teal);color:var(--teal-dark);}
.tt-jumpnav-row a.tt-jump-active{background:var(--teal);border-color:var(--teal);color:var(--on-teal);}

.tt-ad-wrap{margin-block:18px;}
.tt-ad-slot{width:100%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px;color:var(--ink-faint);font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;content-visibility:auto;}
.tt-ad-slot[data-size="leaderboard"]{min-height:90px;}
.tt-ad-slot[data-size="banner"]{min-height:100px;}
@media(min-width:600px){.tt-ad-slot[data-size="leaderboard"]{min-height:90px;}.tt-ad-slot[data-size="banner"]{min-height:120px;}}

.tool-section{padding-block:34px;border-top:1px solid var(--line-soft);}
.tool-section:first-of-type{border-top:none;}
.tool-section h2{font-family:var(--font-display);font-size:clamp(20px,3vw,26px);font-weight:700;letter-spacing:-0.01em;margin:0 0 14px;}

.tt-layout{display:grid;grid-template-columns:1fr;gap:24px;align-items:start;padding-top:4px;}
@media(min-width:960px){.tt-layout{grid-template-columns:1fr 220px;}}

.tt-panel{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);}
@media(min-width:600px){.tt-panel{padding:26px;}}

.tt-field-label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;}
.field{width:100%;min-height:50px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius-md);background:var(--surface);font-family:var(--font-mono);font-size:15px;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s;}
.field:hover{border-color:var(--ink-faint);}
.field:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-tint);background:var(--bg);}
.field[aria-invalid="true"]{border-color:var(--danger);}
.field[aria-invalid="true"]:focus{box-shadow:0 0 0 4px var(--danger-tint);}

.tt-error{display:none;align-items:flex-start;gap:9px;margin-top:14px;padding:12px 14px;border-radius:var(--radius-md);background:var(--danger-tint);color:var(--danger);font-size:13.5px;font-weight:500;}
.tt-error.show{display:flex;animation:tt-shake .35s ease;}
.tt-error svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;}
@keyframes tt-shake{10%,90%{transform:translateX(-1px);}20%,80%{transform:translateX(2px);}30%,50%,70%{transform:translateX(-3px);}40%,60%{transform:translateX(3px);}}

.tt-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:var(--radius-md);font-weight:600;font-size:15px;border:none;cursor:pointer;transition:transform .08s ease,background .15s,box-shadow .15s,opacity .15s;-webkit-tap-highlight-color:transparent;}
.tt-btn:active{transform:scale(.97);}
.tt-btn-primary{background:var(--teal);color:var(--on-teal);width:100%;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.tt-btn-primary:hover{background:var(--teal-dark);}
[data-theme="dark"] .tt-btn-primary:hover,[data-theme="dark"] .nav-cta:hover{background:#1c6a55;color:#EEF3F1;}
.tt-btn-primary:disabled{opacity:.75;cursor:progress;}
.tt-btn-secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
.tt-btn-secondary:hover{background:var(--surface-2);}

.tt-empty-state{text-align:center;padding:22px 14px;border:1.5px dashed var(--line);border-radius:var(--radius-md);background:var(--surface);}
.tt-empty-state .ico{font-size:26px;margin-bottom:6px;}
.tt-empty-state h2{margin:0 0 4px;font-family:var(--font-display);font-size:15px;font-weight:600;}
.tt-empty-state p{margin:0 0 14px;font-size:13.5px;color:var(--ink-soft);}
.tt-example-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.tt-example-chip{min-height:38px;padding:0 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:border-color .15s,color .15s,transform .08s;}
.tt-example-chip:hover{border-color:var(--teal);color:var(--teal-dark);}
.tt-example-chip:active{transform:scale(.96);}

.tt-result{display:none;margin-top:20px;animation:tt-fade-up .35s ease both;}
.tt-result.show{display:block;}
.tt-result:focus{outline:none;}
.tt-result:focus-visible{outline:2.5px solid var(--laser);outline-offset:4px;border-radius:8px;}
@keyframes tt-fade-up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.tt-result-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.tt-result-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;}
.tt-check{width:20px;height:20px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:tt-pop .4s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes tt-pop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
.tt-result-actions{display:flex;gap:6px;flex-wrap:wrap;}
.tt-icon-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:background .15s,border-color .15s,transform .08s,color .15s;}
.tt-icon-btn svg{width:14px;height:14px;}
.tt-icon-btn:hover{background:var(--surface);border-color:var(--ink-faint);}
.tt-icon-btn:active{transform:scale(.95);}
.tt-icon-btn.tt-success{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-dark);}

.tt-sticky-actions{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);gap:10px;box-shadow:0 -6px 20px rgba(16,22,21,0.06);}
.tt-sticky-actions.is-active{display:flex;}
.tt-sticky-actions .tt-btn{margin:0;}
.tt-sticky-actions .tt-btn-secondary{flex:0 0 auto;width:auto;padding:0 16px;}
.tt-sticky-actions .tt-btn-primary{flex:1;}
@media(min-width:720px){.tt-sticky-actions{display:none !important;}}
body.tt-has-sticky-bar{padding-bottom:var(--sticky-bar-h);}
@media(min-width:720px){body.tt-has-sticky-bar{padding-bottom:0;}}

.tt-toc{display:none;}
@media(min-width:960px){
  .tt-toc{display:block;position:sticky;top:calc(var(--header-h) + var(--jumpnav-h) + 20px);max-height:calc(100vh - var(--header-h) - var(--jumpnav-h) - 40px);overflow-y:auto;border-left:1px solid var(--line);padding-left:16px;}
  .tt-toc h2{margin:0 0 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .tt-toc a{display:block;padding:6px 0;font-size:13.5px;color:var(--ink-soft);text-decoration:none;border-left:2px solid transparent;margin-left:-17px;padding-left:15px;transition:color .15s,border-color .15s;}
  .tt-toc a:hover{color:var(--ink);}
  .tt-toc a.tt-toc-active{color:var(--teal);border-color:var(--teal);font-weight:600;}
}

.tt-article h2{font-family:var(--font-display);font-size:clamp(19px,2.6vw,23px);font-weight:700;margin:28px 0 12px;}
.tt-article h2:first-child{margin-top:0;}
.tt-article h3{font-family:var(--font-display);font-size:16.5px;font-weight:600;margin:22px 0 8px;}
.tt-article p{color:var(--ink-soft);margin:0 0 12px;}
.tt-article ul:not([class]){color:var(--ink-soft);font-size:14.5px;margin:0 0 14px;display:grid;gap:6px;}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:tt-step;display:grid;gap:10px;}
.steps li{counter-increment:tt-step;position:relative;padding:12px 14px 12px 46px;background:var(--surface);border-radius:var(--radius-md);font-size:14.5px;}
.steps li::before{content:counter(tt-step);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--teal);color:var(--on-teal);font-family:var(--font-mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;}

.tt-callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius-md);margin:16px 0;}
.tt-callout-icon{font-size:18px;flex-shrink:0;}
.tt-callout p{margin:0;font-size:13.5px;color:var(--ink);}
.tt-tip{background:var(--teal-tint);}
.tt-warn{background:var(--laser-tint);}
.tt-target-result{font-size:13.5px;font-weight:600;color:var(--teal-dark);}
[data-theme="dark"] .tt-target-result{color:var(--teal);}

.tt-example-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px;}
.tt-example-table th,.tt-example-table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);}
.tt-example-table th{color:var(--ink-faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.tt-example-table code{font-family:var(--font-mono);background:var(--surface);padding:2px 6px;border-radius:5px;font-size:12.5px;}
.tt-example-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

.tt-format-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px;}
.tt-format-icon{width:40px;height:40px;border-radius:10px;background:var(--teal-tint);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.tt-format-head h2{margin:0;}
.tt-format-sub{margin:2px 0 0;font-size:13px;color:var(--ink-faint);font-family:var(--font-mono);}
.tt-format-try{margin-left:auto;flex-shrink:0;}
@media(max-width:560px){.tt-format-try{width:100%;margin-left:0;margin-top:6px;}}

.tt-proscons{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
@media(max-width:640px){.tt-proscons{grid-template-columns:1fr;}}
.tt-pros,.tt-cons{padding:14px 16px;border-radius:var(--radius-md);}
.tt-pros{background:var(--teal-tint);}
.tt-cons{background:var(--surface);}
.tt-pros h4,.tt-cons h4{margin:0 0 8px;font-size:13px;font-weight:700;}
.tt-pros ul,.tt-cons ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-soft);display:grid;gap:5px;}

.tt-mistake-list{display:grid;gap:8px;margin:0 0 16px;padding:0;list-style:none;}
.tt-mistake-list li{padding:10px 12px 10px 34px;position:relative;font-size:14px;color:var(--ink-soft);background:var(--surface);border-radius:9px;}
.tt-mistake-list li::before{content:"✕";position:absolute;left:12px;color:var(--danger);font-weight:700;font-size:12px;top:11px;}

.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.feature-card{background:var(--surface);border-radius:var(--radius-md);padding:16px;text-align:center;}
.feature-card .ico{font-size:22px;margin-bottom:8px;}
.feature-card h3{margin:0;font-size:13.5px;font-weight:600;}

.tt-compare-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius-md);border:1px solid var(--line);margin-top:14px;}
.tt-compare{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px;}
.tt-compare th,.tt-compare td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);}
.tt-compare thead th{background:var(--surface);font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);}
.tt-compare tbody tr:last-child td{border-bottom:none;}
.tt-highlight-col{background:var(--teal-tint);font-weight:600;color:var(--teal-dark);}
.tt-compare .yes{color:var(--teal-dark);font-weight:700;}
.tt-compare .no{color:var(--ink-faint);}
.tt-compare-note{font-size:12px;color:var(--ink-faint);margin-top:8px;}

.tt-trust-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:16px;}
.tt-trust-item{display:flex;gap:12px;padding:14px;background:var(--surface);border-radius:var(--radius-md);}
.tt-trust-item svg{width:20px;height:20px;color:var(--teal);flex-shrink:0;margin-top:2px;}
.tt-trust-item h3{margin:0 0 3px;font-size:14px;font-weight:600;}
.tt-trust-item p{margin:0;font-size:12.5px;color:var(--ink-soft);}

.faq-item{border-bottom:1px solid var(--line);}
.faq-item:first-child{border-top:1px solid var(--line);}
.faq-q{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 4px;cursor:pointer;font-weight:600;font-size:15px;min-height:48px;}
.faq-q .chev{flex-shrink:0;transition:transform .2s;color:var(--ink-faint);}
.faq-item.open .chev{transform:rotate(180deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.faq-item.open .faq-a{max-height:260px;}
.faq-a p{margin:0 4px 16px;color:var(--ink-soft);font-size:14px;}

.ai-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;}
.ai-panel h2{margin:0;font-family:var(--font-display);font-size:16px;}
.ai-q{margin-top:12px;padding:11px 13px;background:var(--bg);border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;}
.ai-a{display:none;padding:10px 13px;font-size:13.5px;color:var(--ink-soft);}
.ai-q.open + .ai-a{display:block;}
.ai-input-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.ai-input-row .field{flex:1;min-width:160px;}
.ai-input-row .btn{min-height:48px;padding:0 18px;border-radius:var(--radius-md);border:none;background:var(--teal);color:var(--on-teal);font-weight:600;cursor:pointer;}
#aiCustomAnswer{margin-top:10px;padding:11px 13px;background:var(--bg);border:1px solid var(--line);border-radius:9px;font-size:13.5px;color:var(--ink-soft);}

.tt-request-cta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--teal-dark);color:#fff;border-radius:var(--radius-lg);padding:22px;}
[data-theme="dark"] .tt-request-cta{background:#103a30;}
.tt-request-cta h2{margin:0 0 4px;font-family:var(--font-display);font-size:18px;}
.tt-request-cta p{margin:0;font-size:13.5px;color:#CFE4DF;}
.tt-request-cta .tt-btn{background:#fff;color:var(--teal-dark);width:auto;text-decoration:none;padding:0 20px;flex-shrink:0;}
[data-theme="dark"] .tt-request-cta .tt-btn{color:#0C4137;}

.tt-chip-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.tt-tool-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:9px 14px;border-radius:20px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:border-color .15s,transform .1s;}
.tt-tool-chip:hover{border-color:var(--teal);}
.tt-tool-chip .em{font-size:15px;}

.related-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.related-card{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);padding:13px;transition:border-color .15s,transform .1s;}
.related-card:hover{border-color:var(--teal);transform:translateY(-1px);}
.related-emoji{font-size:20px;flex-shrink:0;}

.comment-box{background:var(--surface);border-radius:var(--radius-md);padding:16px;}
.comment-input-row{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;}
.comment-input-row .field{flex:1;min-width:160px;}
.comment-input-row .tt-btn{width:auto;flex:0 0 auto;padding:0 18px;min-height:48px;}
.comment-list{display:grid;gap:10px;}
.comment-item{display:flex;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;}
.comment-body{flex:1;min-width:0;}
.comment-delete{flex-shrink:0;align-self:flex-start;min-width:32px;min-height:32px;border:1px solid var(--line);background:var(--surface);color:var(--ink-faint);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;line-height:1;transition:background .15s,color .15s,border-color .15s;}
.comment-delete:hover{background:var(--danger-tint);color:var(--danger);border-color:var(--danger);}
.comment-empty{font-size:13px;color:var(--ink-faint);padding:6px 2px;}
.comment-avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.comment-meta{font-size:11.5px;color:var(--ink-faint);margin-bottom:2px;}
.comment-text{font-size:13.5px;}

footer.compact-footer{border-top:1px solid var(--line);}
.compact-footer-links{max-width:1120px;margin:0 auto;padding:22px clamp(14px,4vw,32px) 10px;display:flex;flex-wrap:wrap;gap:6px 4px;font-size:12.5px;justify-content:center;}
.compact-footer-links a{text-decoration:none;color:var(--ink-faint);padding:4px 2px;}
.compact-footer-links a:hover{color:var(--teal);}
.compact-footer-links .sep{color:var(--line);}
.compact-footer-copy{text-align:center;font-size:12px;color:var(--ink-faint);padding-bottom:22px;}

.tt-reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;}
.tt-reveal.tt-visible{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){.tt-reveal{opacity:1;transform:none;transition:none;}}
.tt-visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
</style>
</head>
